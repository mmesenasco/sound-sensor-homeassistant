device_id: "linux-mic-01"

audio:
  sample_rate: 16000
  channels: 1
  window_seconds: 1.0
  hop_seconds: 0.5
  mic_device_index: null

detection:
  mode: "yamnet"
  yamnet:
    model_url: "https://storage.googleapis.com/audioset/yamnet/yamnet.tflite"
    classes_url: "https://storage.googleapis.com/audioset/yamnet/yamnet_class_map.csv"
    # Each entry is scored independently; the highest-scoring one that clears
    # its own conf_threshold wins for a given audio window. `name` is what
    # ends up as the MQTT event / HA sensor state, so keep it a stable slug.
    watched_classes:
      - name: dog_bark
        label_substrings: ["dog", "bark", "bow-wow", "yip"]
        conf_threshold: 0.6
      - name: glass_break
        label_substrings: ["glass", "shatter"]
        conf_threshold: 0.5
      - name: alarm
        label_substrings: ["alarm", "siren", "smoke detector", "fire alarm"]
        conf_threshold: 0.5
      - name: scream
        label_substrings: ["scream", "shout", "yell", "crying, sobbing"]
        conf_threshold: 0.6
  heuristic:
    rms_threshold: 0.02
    band_low_hz: 400
    band_high_hz: 3000
    band_energy_min: 1.0e-6

smoothing:
  window_count: 3
  positives_required: 2
  cooldown_seconds: 20

capture:
  enabled: true
  ring_seconds: 20
  pre_seconds: 5
  post_seconds: 5
  out_dir: "/var/lib/barkdetector/captures"
  max_age_hours: 24  # 0 = keep forever

# Credentials may be left blank here and supplied via environment variables
# instead: BARKDETECTOR_MQTT_HOST / _PORT / _TOPIC / _USERNAME / _PASSWORD /
# _CLIENT_ID. Environment values win over anything set below.
mqtt:
  host: "192.168.1.10"
  port: 1883
  topic: "home/sensors/dog_bark"
  username: ""
  password: ""
  client_id: ""

dailybot:
  workflow_url: ""

logging:
  level: "INFO"
  file_path: "/var/log/barkdetector/barkdetector.log"
