# Example automations for the Sound Detector add-on (formerly "Bark Detector").
# Paste into Settings -> Automations -> Create -> Edit in YAML.
#
# The add-on now creates a single `sensor.<device_id>_sound` entity whose
# STATE is the name of whichever watched class last matched: dog_bark,
# glass_break, alarm, scream, knock_doorbell, or any custom class you added.
# Attributes: score (confidence 0-1), last_triggered (epoch seconds), detector.

# ---------------------------------------------------------------------------
# One trigger per sound, each with its own action.
# The sensor holds its last value until the next event (no "off" state), so
# these fire on the state CHANGE to that value -- if the same sound repeats
# back-to-back with nothing else detected in between, this won't refire; see
# the "raw MQTT" alternative below if you need every single occurrence.
# ---------------------------------------------------------------------------
alias: Dog Bark - Turn On Light
triggers:
  - trigger: state
    entity_id: sensor.barkdetector_sound
    to: "dog_bark"
conditions: []
actions:
  - action: light.turn_on
    target:
      entity_id: light.garden
mode: single

---
alias: Glass Break - Activate Siren
triggers:
  - trigger: state
    entity_id: sensor.barkdetector_sound
    to: "glass_break"
conditions: []
actions:
  - action: switch.turn_on
    target:
      entity_id: switch.siren
  - action: notify.notify
    data:
      message: >-
        🚨 Glass break detected (confidence
        {{ state_attr('sensor.barkdetector_sound', 'score') }})
mode: single

# ---------------------------------------------------------------------------
# NOTE: as of this version, the add-on's discovery config sets force_update,
# so HA now fires a state_changed event on EVERY MQTT message, even when the
# value repeats (e.g. two glass_break events in a row). That means the plain
# "trigger: state ... to: glass_break" pattern above already catches every
# occurrence on its own -- you generally don't need the attribute-based
# pattern below anymore. Kept as a reference in case you ever disable
# force_update, or want to trigger on a class regardless of which one fired
# last without listing every "to:" value separately.
# ---------------------------------------------------------------------------
# Catch EVERY occurrence, even repeats of the same class back-to-back.
# A plain state trigger only fires on a CHANGE, so two dog_bark events in a
# row with nothing else in between would only fire once. The last_triggered
# attribute (epoch seconds) changes on every single publish, so triggering on
# IT instead of the main state catches every event; filter by class with a
# condition.
# ---------------------------------------------------------------------------
alias: Every Dog Bark (including repeats)
triggers:
  - trigger: state
    entity_id: sensor.barkdetector_sound
    attribute: last_triggered
conditions:
  - condition: template
    value_template: "{{ trigger.to_state.state == 'dog_bark' }}"
actions:
  - action: light.turn_on
    target:
      entity_id: light.garden
mode: queued

